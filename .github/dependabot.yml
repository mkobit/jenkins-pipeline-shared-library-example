version: 2

# Define reusable list of Jenkins plugin dependency names for allow/ignore
x-jenkins-plugins: &jenkins-plugins
  - dependency-name: "io.jenkins:*"
  - dependency-name: "io.jenkins.*:*"
  - dependency-name: "com.jenkins:*"
  - dependency-name: "com.jenkins.*:*"
  - dependency-name: "org.6wind.jenkins:*"
  - dependency-name: "org.6wind.jenkins.*:*"
  - dependency-name: "org.jenkins-ci.plugins:*"
  - dependency-name: "org.jenkins-ci.plugins.*:*"
  - dependency-name: "org.jenkinsci.plugins:*"
  - dependency-name: "org.jenkinsci.plugins.*:*"
  - dependency-name: "org.jenkins-ci.modules:*"
  - dependency-name: "org.jenkins-ci.modules.*:*"

# Define reusable list of Jenkins plugin patterns for groups
x-jenkins-plugin-patterns: &jenkins-plugin-patterns
  - "io.jenkins:*"
  - "io.jenkins.*:*"
  - "com.jenkins:*"
  - "com.jenkins.*:*"
  - "org.6wind.jenkins:*"
  - "org.6wind.jenkins.*:*"
  - "org.jenkins-ci.plugins:*"
  - "org.jenkins-ci.plugins.*:*"
  - "org.jenkinsci.plugins:*"
  - "org.jenkinsci.plugins.*:*"
  - "org.jenkins-ci.modules:*"
  - "org.jenkins-ci.modules.*:*"

updates:
  - package-ecosystem: "gradle"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "infra"
    cooldown:
      default-days: 60
    allow: *jenkins-plugins
    groups:
      jenkins-plugins:
        patterns: *jenkins-plugin-patterns

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "infra"
    cooldown:
      # Gradle wrapper and test-framework bumps can land quickly; Jenkins plugin
      # dependencies managed by the BOM are in the ignore list below.
      default-days: 14
    ignore:
      - dependency-name: "io.jenkins:*"
      - dependency-name: "io.jenkins.*:*"
      - dependency-name: "com.jenkins:*"
      - dependency-name: "com.jenkins.*:*"
      - dependency-name: "org.6wind.jenkins:*"
      - dependency-name: "org.6wind.jenkins.*:*"
      - dependency-name: "org.jenkins-ci.plugins:*"
      - dependency-name: "org.jenkins-ci.plugins.*:*"
      - dependency-name: "org.jenkinsci.plugins:*"
      - dependency-name: "org.jenkinsci.plugins.*:*"
      - dependency-name: "org.jenkins-ci.modules:*"
      - dependency-name: "org.jenkins-ci.modules.*:*"

      # Jenkins BOM and pinned groovy-all are kept in sync with the Jenkins LTS
      # line manually — Dependabot should not propose bumps for these.
      - dependency-name: "io.jenkins.tools.bom:*"
      - dependency-name: "org.codehaus.groovy:groovy"
      # This project owns the shared-library plugin; pin updates manually.
      - dependency-name: "com.mkobit.jenkins.pipelines.shared-library"
    groups:
      kotest:
        patterns:
          - "io.kotest:*"
      junit:
        patterns:
          - "org.junit.*:*"
      spock:
        patterns:
          - "org.spockframework:*"
      jetbrains:
        patterns:
          - "org.jetbrains:*"
          - "org.jetbrains.*:*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "infra"
    cooldown:
      default-days: 30
    groups:
      github-actions-first-party:
        patterns:
          - "actions/*"
      gradle-actions:
        patterns:
          - "gradle/*"
      third-party-actions:
        patterns:
          - "*"
