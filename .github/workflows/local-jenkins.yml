name: Local Jenkins

on:
  push:
    branches:
      - main
    paths:
      - 'local-jenkins/**'
  pull_request:
    paths:
      - 'local-jenkins/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  local-jenkins:
    name: Build and smoke test local Jenkins image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Check plugins.txt is sorted
        working-directory: local-jenkins
        run: |
          sorted=$(sort -t: -k1,1 plugins.txt)
          actual=$(cat plugins.txt)
          if [ "$sorted" != "$actual" ]; then
            echo "plugins.txt is not alphabetically sorted by plugin ID"
            diff <(echo "$actual") <(echo "$sorted")
            exit 1
          fi

      - name: Set up Docker Buildx
        run: docker buildx create --use --driver docker-container

      - name: Build image
        working-directory: local-jenkins
        run: |
          docker buildx bake \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load

      - name: Start Jenkins
        working-directory: local-jenkins
        run: docker compose up --detach

      - name: Wait for Jenkins
        run: |
          echo "Polling Jenkins at http://localhost:8080/login ..."
          for i in $(seq 1 24); do
            if curl -sf -o /dev/null http://localhost:8080/login; then
              echo "Jenkins is ready."
              exit 0
            fi
            echo "  Attempt $i/24: not ready yet. Sleeping 5s ..."
            sleep 5
          done
          echo "ERROR: Jenkins did not become ready within 120s." >&2
          docker compose -f local-jenkins/docker-compose.yml logs
          exit 1

      - name: Smoke test — API
        run: |
          response=$(curl -sf http://localhost:8080/api/json)
          echo "$response" | grep -q '"mode"' || { echo "Unexpected: $response"; exit 1; }

      - name: Smoke test — Script Console
        run: |
          result=$(curl -sf \
            --data-urlencode 'script=println "hello from script console"' \
            http://localhost:8080/scriptText)
          echo "$result" | grep -q "hello from script console" || {
            echo "Script Console test failed. Got: $result"; exit 1; }

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: 21
          distribution: temurin

      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e
        with:
          gradle-version: current
          cache-disabled: true

      - name: Export catalog from running Jenkins
        run: |
          curl -sf \
            --data-urlencode "script@scripts/export-jenkins-catalog.groovy" \
            http://localhost:8080/scriptText \
            -o /tmp/generated-catalog.toml
          echo "Generated $(wc -l < /tmp/generated-catalog.toml) lines"

      - name: Validate catalog loads in Gradle
        run: |
          mkdir /tmp/catalog-check
          cat > /tmp/catalog-check/settings.gradle.kts << 'EOF'
          dependencyResolutionManagement {
            versionCatalogs {
              create("jenkinsPlugins") {
                from(files("/tmp/generated-catalog.toml"))
              }
            }
          }
          rootProject.name = "catalog-check"
          EOF
          touch /tmp/catalog-check/build.gradle.kts
          cd /tmp/catalog-check && gradle --no-daemon help

      - name: Stop Jenkins
        if: always()
        working-directory: local-jenkins
        run: docker compose down --volumes
